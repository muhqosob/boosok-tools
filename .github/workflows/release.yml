# Naikkan PLUGIN_VERSION di src/boosok_tools_loader.rb lalu push ke main.
# Pesan commit terakhir dipakai sebagai changelog. Push tanpa naik versi = tidak rilis.
name: Release

on:
  push:
    branches: [main]
    paths: ['src/**']

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Cek versi
        id: v
        run: |
          VER=$(grep -oP 'PLUGIN_VERSION = "\K[^"]+' src/boosok_tools_loader.rb)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          if gh release view "v$VER" >/dev/null 2>&1; then
            echo "v$VER sudah dirilis, skip."
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Cek syntax Ruby
        if: steps.v.outputs.skip != '1'
        run: find src -name '*.rb' -print0 | xargs -0 -n1 ruby -c

      - name: Build & publish release
        if: steps.v.outputs.skip != '1'
        env:
          VER: ${{ steps.v.outputs.ver }}
          CHANGELOG: ${{ github.event.head_commit.message }}
        run: |
          FILE="boosok_tools_v$VER.rbz"
          (cd src && zip -qr "../$FILE" .)
          gh release create "v$VER" "$FILE" --target "$GITHUB_SHA" -t "v$VER" -n "$CHANGELOG"

          # version.json diupdate SETELAH asset ada, supaya user tidak dapat link 404.
          # Path ini dibaca semua versi yang sudah terpasang, jangan dipindah.
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/v$VER/$FILE"
          python3 -c 'import json,sys; json.dump({"version":sys.argv[1],"download_url":sys.argv[2],"changelog":sys.argv[3]}, open("the_bosok/version.json","w"), indent=2, ensure_ascii=False)' "$VER" "$URL" "$CHANGELOG"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add the_bosok/version.json
          git commit -m "Update version.json ke v$VER"
          git pull --rebase -q
          git push
