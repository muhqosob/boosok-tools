<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>The Selector</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap');

    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --danger: #ef4444;
      --bg-main: #f3f4f6;
      --bg-card: #ffffff;
      --border: #e5e7eb;
      --text-main: #111827;
      --text-muted: #6b7280;
      --radius-lg: 16px;
      --radius-sm: 8px;
    }

    html, body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-main); 
      padding: 10px;
      color: var(--text-main);
      font-size: 13px;
      margin: 0;
      height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column; 
      align-items: stretch;
    }

    /* TITLE */
    .main-title { 
      margin: 0 0 14px 0; 
      font-size: 26px; 
      font-weight: 800;
      letter-spacing: -0.03em;
      background: linear-gradient(135deg, #4f46e5 0%, #0ea5e9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-align: center;
      flex-shrink: 0; 
    }

    /* CARD CONTAINER */
    .card { 
      background: var(--bg-card); 
      padding: 16px; 
      border-radius: var(--radius-lg); 
      border: 1px solid rgba(0,0,0,0.05);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.025); 
      display: flex; 
      flex-direction: column; 
      box-sizing: border-box;
      flex: 1;
      position: relative;
      /* Diubah ke visible agar dropdown kustom kita bisa melayang keluar batas kotak */
      overflow: visible; 
    }

    /* STEPS */
    .step { display: none; flex-direction: column; flex: 1; animation: fadeIn 0.3s ease-out; }
    .step.active { display: flex; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateX(10px); }
      to { opacity: 1; transform: translateX(0); }
    }

    /* FORM GROUPS */
    .form-group { margin-bottom: 12px; }
    .form-group label {
      display: block; font-size: 11px; font-weight: 600; color: var(--text-main); margin-bottom: 5px;
    }
    select, input[type="text"] {
      width: 100%; padding: 9px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
      outline: none; transition: all 0.2s ease; font-size: 12px; background: #f9fafb;
      box-sizing: border-box; font-family: inherit; color: var(--text-main);
    }
    select:focus, input[type="text"]:focus {
      border-color: var(--primary); background: #fff; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    /* CUSTOM SEARCHABLE DROPDOWN */
    .searchable-dropdown { position: relative; width: 100%; }
    .searchable-dropdown input { cursor: text; }
    .dropdown-list {
      display: none; position: absolute; top: 100%; left: 0; right: 0; background: #fff;
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-height: 150px; overflow-y: auto; z-index: 999;
      margin-top: 4px; padding: 4px;
    }
    .dropdown-list::-webkit-scrollbar { width: 5px; }
    .dropdown-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .dropdown-item {
      padding: 8px 10px; cursor: pointer; font-size: 11px; border-radius: 4px; transition: 0.1s;
    }
    .dropdown-item:hover { background: #f1f5f9; color: var(--primary); font-weight: 600; }

    /* ATTRIBUTE ROW */
    .attr-row { display: flex; gap: 6px; }
    .btn-icon {
      background: #f1f5f9; border: 1px solid var(--border); color: var(--text-main);
      padding: 0 12px; border-radius: var(--radius-sm); cursor: pointer; transition: 0.2s;
      display: flex; align-items: center; justify-content: center;
    }
    .btn-icon:hover { background: #e2e8f0; color: var(--primary); }

    /* CUSTOM CHECKBOX */
    .checkbox-group {
      display: flex; align-items: center; padding: 10px; background: #f8fafc;
      border: 1px solid var(--border); border-radius: var(--radius-sm); margin-bottom: 12px; cursor: pointer;
    }
    .checkbox-group:hover { background: #f1f5f9; }
    .checkbox-group input[type="checkbox"] { 
      appearance: none; -webkit-appearance: none; width: 18px; height: 18px;
      border: 2px solid #cbd5e1; border-radius: 4px; margin-right: 10px; position: relative;
      cursor: pointer; transition: all 0.2s ease; background: #fff;
    }
    .checkbox-group input[type="checkbox"]:checked { background-color: var(--primary); border-color: var(--primary); }
    .checkbox-group input[type="checkbox"]:checked::after {
      content: ''; position: absolute; left: 5px; top: 2px; width: 4px; height: 8px;
      border: solid white; border-width: 0 2px 2px 0; transform: rotate(45deg);
    }
    .checkbox-group label { font-size: 12px; font-weight: 500; cursor: pointer; margin: 0; color: var(--text-main); }

    #attribute-section { display: none; padding-top: 5px; border-top: 1px dashed var(--border); margin-top: 5px;}

    /* BUTTONS */
    .btn {
      padding: 10px 20px; font-size: 13px; font-weight: 600; border: none;
      border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s ease;
      font-family: inherit; width: 100%; display: flex; align-items: center; justify-content: center;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }
    .btn-primary { background-color: var(--primary); color: white; box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.3); }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-secondary { background-color: #f1f5f9; color: var(--text-main); }
    .btn-secondary:hover { background-color: #e2e8f0; }

    /* MODAL ATTRIBUTE */
    #modalOverlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 1000;
      backdrop-filter: blur(2px);
    }
    .modal-box {
      background: #fff; padding: 20px; border-radius: var(--radius-lg); width: 80%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); animation: slideUp 0.3s ease;
    }
    .modal-box h3 { margin: 0 0 12px 0; font-size: 15px; color: var(--text-main); }
    .attr-list-container {
      max-height: 120px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius-sm);
      margin-bottom: 12px; background: #fafafa;
    }
    .attr-item {
      display: flex; justify-content: space-between; align-items: center; padding: 8px 10px;
      border-bottom: 1px solid var(--border); font-size: 11px;
    }
    .attr-item:last-child { border-bottom: none; }
    .btn-delete { background: #fee2e2; color: var(--danger); border: none; border-radius: 4px; padding: 4px 8px; font-size: 10px; font-weight: bold; cursor: pointer; }
    .btn-delete:hover { background: #fca5a5; }
    .modal-buttons { display: flex; gap: 8px; margin-top: 12px; }

    /* TOAST & SUCCESS ANIMATION */
    #toast-container { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 85%; align-items: center;}
    .toast { background: #1f2937; color: #fff; padding: 12px 20px; border-radius: 30px; font-size: 12px; font-weight: 500; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); display: flex; align-items: center; gap: 8px; animation: slideUp 0.3s forwards, fadeOut 0.3s ease 2.7s forwards;}
    .toast.error { background: var(--danger); }
    @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }

    .success-icon-wrapper { display: flex; justify-content: center; margin: 40px 0 20px 0; }
    .success-icon { width: 70px; height: 70px; background: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; box-shadow: 0 4px 14px rgba(16, 185, 129, 0.4); }
    .success-icon svg { width: 35px; height: 35px; }
  </style>
</head>
<body>

  <h1 class="main-title">The Selector</h1>
  
  <div class="card">
    
    <!-- STEP 1: FORM PENCARIAN -->
    <div id="step1" class="step active">
      
      <!-- Custom Searchable Dropdown untuk Tag Utama -->
      <div class="form-group">
        <label>Tag Utama (Parent / Level 1)</label>
        <div class="searchable-dropdown">
          <input type="text" id="tagUtamaSelect" value="(Semua Tag / Abaikan)" placeholder="Ketik nama tag..." onfocus="openDropdown('listTagUtama', this)" onkeyup="filterDropdown(this, 'listTagUtama')" autocomplete="off">
          <div id="listTagUtama" class="dropdown-list"></div>
        </div>
      </div>

      <!-- Custom Searchable Dropdown untuk Tag Kedua -->
      <div class="form-group">
        <label>Sub-Tag (Objek / Column)</label>
        <div class="searchable-dropdown">
          <input type="text" id="tagKeduaSelect" value="(Semua Tag / Abaikan)" placeholder="Ketik nama tag..." onfocus="openDropdown('listTagKedua', this)" onkeyup="filterDropdown(this, 'listTagKedua')" autocomplete="off">
          <div id="listTagKedua" class="dropdown-list"></div>
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <div class="form-group" style="flex: 1;">
          <label>Tipe Nama</label>
          <select id="searchType">
            <option value="Instance Name">Instance</option>
            <option value="Definition Name">Definition</option>
          </select>
        </div>
        <div class="form-group" style="flex: 2;">
          <label>Kata Kunci Nama</label>
          <input type="text" id="keyword" placeholder="Cari nama...">
        </div>
      </div>

      <!-- Toggle Checkbox Custom -->
      <label class="checkbox-group">
        <input type="checkbox" id="useAttr" onclick="toggleAttributeSection()">
        <span>Gunakan Filter Atribut Custom</span>
      </label>

      <!-- Section Atribut Tersembunyi -->
      <div id="attribute-section">
        <div class="form-group">
          <label>Nama Atribut (Key)</label>
          <div class="attr-row">
            <select id="attrKeySelect"></select>
            <button type="button" class="btn-icon" onclick="openModal()" title="Kelola Key">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Nilai Atribut (Value)</label>
          <input type="text" id="attrVal" placeholder="Masukkan value...">
        </div>
      </div>

      <div style="flex:1;"></div>
      <button id="btnSubmit" class="btn btn-primary" style="margin-top: 15px;" onclick="submitData()">Jalankan Seleksi</button>

    </div>

    <!-- STEP 2: SUCCESS STATE -->
    <div id="stepSuccess" class="step" style="text-align: center;">
      <div class="success-icon-wrapper">
        <div class="success-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
      </div>
      
      <h2 style="font-size: 20px; margin-bottom: 8px; color: var(--text-main);">Selesai!</h2>
      <p id="success-msg" style="color: var(--text-muted); margin-bottom: 30px; line-height: 1.5;"></p>
      
      <div style="flex:1;"></div>
      
      <!-- Tombol Bersebelahan (Side-by-Side) Kiri Kanan -->
      <div style="display: flex; gap: 10px; width: 100%;">
        <button class="btn btn-primary" style="flex: 1; padding: 10px 0;" onclick="showStep('step1')">⟲ Seleksi Lagi</button>
        <button class="btn btn-secondary" style="flex: 1; padding: 10px 0;" onclick="sketchup.closeDialog()">Tutup ✖</button>
      </div>

    </div>

  </div>

  <!-- MODAL KELOLA ATRIBUT -->
  <div id="modalOverlay">
    <div class="modal-box">
      <h3>Kelola Key Atribut</h3>
      
      <div class="attr-list-container" id="attrListContainer"></div>
      
      <div class="form-group" style="margin-bottom: 0;">
        <input type="text" id="newKeyInput" placeholder="Ketik key baru..." style="margin-bottom: 0;">
      </div>
      
      <div class="modal-buttons">
        <button class="btn btn-secondary" onclick="closeModal()">Batal</button>
        <button class="btn btn-primary" onclick="addNewKey()">Tambah Baru</button>
      </div>
    </div>
  </div>

  <!-- TOAST NOTIFICATION -->
  <div id="toast-container"></div>

  <script>
    window.onload = function() {
      if (typeof sketchup !== 'undefined') sketchup.get_init_data();
    };

    // Auto-save posisinya
    setInterval(function() {
      if (typeof sketchup !== 'undefined') {
        let x = window.screenX, y = window.screenY;
        if (x > 10 && y > 10) sketchup.save_position(JSON.stringify({ left: x, top: y }));
      }
    }, 1500);

    // ---- LOGIKA CUSTOM DROPDOWN PENCARIAN TAG ----
    
    // Klik di luar dropdown untuk menutup kotak pencarian
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.searchable-dropdown')) {
        document.getElementById('listTagUtama').style.display = 'none';
        document.getElementById('listTagKedua').style.display = 'none';
        
        let in1 = document.getElementById('tagUtamaSelect');
        let in2 = document.getElementById('tagKeduaSelect');
        
        // Kembalikan ke nilai sebelumnya jika tidak ada yang dipilih (dibiarkan kosong)
        if(in1.value.trim() === "") in1.value = in1.dataset.oldValue || "(Semua Tag / Abaikan)";
        if(in2.value.trim() === "") in2.value = in2.dataset.oldValue || "(Semua Tag / Abaikan)";
      }
    });

    function openDropdown(listId, inputElement) {
      document.getElementById('listTagUtama').style.display = 'none';
      document.getElementById('listTagKedua').style.display = 'none';
      
      // Kosongkan kolom pencarian saat diklik agar bisa langsung mengetik
      if(inputElement) {
        inputElement.dataset.oldValue = inputElement.value; // Simpan memori teks sebelumnya
        inputElement.value = ""; // Kosongkan teks
        
        // Tampilkan seluruh daftar tag kembali karena kolom teksnya sudah dikosongkan
        let items = document.getElementById(listId).getElementsByClassName('dropdown-item');
        for (let i = 0; i < items.length; i++) {
          items[i].style.display = "";
        }
      }

      document.getElementById(listId).style.display = 'block';
    }

    function filterDropdown(inputElement, listId) {
      openDropdown(listId);
      let filter = inputElement.value.toLowerCase();
      let items = document.getElementById(listId).getElementsByClassName('dropdown-item');
      let hasVisible = false;
      for (let i = 0; i < items.length; i++) {
        let txt = items[i].innerText.toLowerCase();
        if (txt.indexOf(filter) > -1) {
          items[i].style.display = "";
          hasVisible = true;
        } else {
          items[i].style.display = "none";
        }
      }
      document.getElementById(listId).style.display = hasVisible ? 'block' : 'none';
    }

    function selectDropdownItem(inputId, listId, value) {
      document.getElementById(inputId).value = value;
      document.getElementById(listId).style.display = 'none';
    }

    // Menerima Data dari Ruby dan memasukkannya ke Dropdown
    function initUIData(data) {
      let list1 = document.getElementById('listTagUtama');
      let list2 = document.getElementById('listTagKedua');
      
      let html1 = `<div class="dropdown-item" onclick="selectDropdownItem('tagUtamaSelect', 'listTagUtama', '(Semua Tag / Abaikan)')">(Semua Tag / Abaikan)</div>`;
      let html2 = `<div class="dropdown-item" onclick="selectDropdownItem('tagKeduaSelect', 'listTagKedua', '(Semua Tag / Abaikan)')">(Semua Tag / Abaikan)</div>`;
      
      data.tags.forEach(tag => {
        let safeTag = tag.replace(/'/g, "\\'"); // Escape jika nama tag ada kutipnya
        html1 += `<div class="dropdown-item" onclick="selectDropdownItem('tagUtamaSelect', 'listTagUtama', '${safeTag}')">${tag}</div>`;
        html2 += `<div class="dropdown-item" onclick="selectDropdownItem('tagKeduaSelect', 'listTagKedua', '${safeTag}')">${tag}</div>`;
      });
      
      list1.innerHTML = html1;
      list2.innerHTML = html2;

      updateAttrDropdown(data.keys);
    }
    // ------------------------------------------------

    function updateAttrDropdown(keys) {
      let sel = document.getElementById('attrKeySelect'); sel.innerHTML = "";
      let list = document.getElementById('attrListContainer'); list.innerHTML = "";
      
      keys.forEach(key => {
        let opt = document.createElement('option'); opt.value = key; opt.innerHTML = key; sel.appendChild(opt);
        
        let item = document.createElement('div'); item.className = 'attr-item';
        item.innerHTML = `<span>${key}</span> <button class="btn-delete" onclick="deleteKey('${key}')">Hapus</button>`;
        list.appendChild(item);
      });
    }

    function toggleAttributeSection() {
      let isChecked = document.getElementById('useAttr').checked;
      let sec = document.getElementById('attribute-section');
      
      if (isChecked) {
        sec.style.display = "block";
        if (typeof sketchup !== 'undefined') sketchup.resize_dialog(580); 
      } else {
        sec.style.display = "none";
        if (typeof sketchup !== 'undefined') sketchup.resize_dialog(460); 
      }
    }

    function showStep(stepId) {
      document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
      document.getElementById(stepId).classList.add('active');
    }

    function showSuccessStep(msg) {
      document.getElementById('success-msg').innerHTML = msg;
      showStep('stepSuccess');
      resetSubmitButton();
    }

    function showToast(msg) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div'); toast.className = 'toast error';
      toast.innerHTML = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg> ${msg}`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function resetSubmitButton() {
      let btn = document.getElementById('btnSubmit');
      btn.innerText = "Jalankan Seleksi"; btn.disabled = false;
    }

    function submitData() {
      let btn = document.getElementById('btnSubmit');
      btn.innerText = "Mencari..."; btn.disabled = true;

      let data = {
        tag_utama: document.getElementById('tagUtamaSelect').value,
        tag_kedua: document.getElementById('tagKeduaSelect').value,
        search_type: document.getElementById('searchType').value,
        keyword: document.getElementById('keyword').value,
        use_attr: document.getElementById('useAttr').checked,
        attr_key: document.getElementById('attrKeySelect').value,
        attr_val: document.getElementById('attrVal').value,
        left: window.screenX, top: window.screenY
      };

      if (typeof sketchup !== 'undefined') {
        setTimeout(() => sketchup.perform_selection(JSON.stringify(data)), 100);
      }
    }

    // Modal Functions
    function openModal() { document.getElementById('modalOverlay').style.display = 'flex'; document.getElementById('newKeyInput').value = ''; }
    function closeModal() { document.getElementById('modalOverlay').style.display = 'none'; }
    
    function addNewKey() {
      let val = document.getElementById('newKeyInput').value.trim().toLowerCase();
      if (val !== "") {
        let sel = document.getElementById('attrKeySelect');
        let keys = Array.from(sel.options).map(o => o.value);
        if (!keys.includes(val)) {
          keys.push(val); updateAttrDropdown(keys); sel.value = val;
          if (typeof sketchup !== 'undefined') sketchup.save_new_key(val);
        } else { sel.value = val; }
        closeModal();
      }
    }

    function deleteKey(key) {
      let sel = document.getElementById('attrKeySelect');
      let keys = Array.from(sel.options).map(o => o.value).filter(k => k !== key);
      if (keys.length === 0) keys = ["a_posisi"];
      updateAttrDropdown(keys);
      if (typeof sketchup !== 'undefined') sketchup.delete_key(key);
    }
  </script>
</body>
</html>
