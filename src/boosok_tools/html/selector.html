<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Selector</title>
  <link rel="stylesheet" href="../css/ui.css">
  <style>
    #attr { display: none; flex-direction: column; gap: 12px; }
    #attr.open { display: flex; animation: rise .25s var(--ease); }
    .keys { max-height: 150px; flex: none; }
    .keys .k { display: flex; align-items: center; gap: 8px; padding: 4px 4px 4px 10px; border-radius: 7px; font-size: 12.5px; }
    .keys .k:hover { background: var(--bg); }
    .keys .k span { flex: 1; min-width: 0; word-break: break-all; }
    .keys .k .btn { height: 28px; width: 28px; color: var(--muted); }
    .keys .k .btn:hover { color: var(--err); background: var(--err-soft); }
    .seg.h34 { height: 34px; }
    .seg.h34 button { padding: 0 10px; }
  </style>
</head>
<body oncontextmenu="return false;">
  <script src="../js/ui.js"></script>

  <header class="head">
    <button class="back-btn" type="button" title="Kembali ke Boosok Tools" aria-label="Kembali ke Hub" onclick="backToHub()"><svg><use href="#i-arrow-left"/></svg></button>
    <div class="mark"><svg><use href="#i-mouse-pointer-click"/></svg></div>
    <div class="txt">
      <h1>Selector</h1>
      <p>Seleksi objek berdasarkan tag, nama & atribut</p>
    </div>
    <button class="theme-btn" id="themeToggle" type="button" title="Ganti Tema" aria-label="Ganti Tema"></button>
  </header>

  <!-- Form -->
  <section class="step active" id="step1">
    <div class="field">
      <label for="tag1">Tag utama (parent)</label>
      <div class="combo with-ic" id="c1">
        <svg class="lead"><use href="#i-tags"/></svg>
        <input class="input" id="tag1" autocomplete="off" spellcheck="false">
        <svg class="trail"><use href="#i-chevron-down"/></svg>
        <div class="menu"></div>
      </div>
    </div>

    <div class="field">
      <label for="tag2">Sub-tag (objek)</label>
      <div class="combo with-ic" id="c2">
        <svg class="lead"><use href="#i-tag"/></svg>
        <input class="input" id="tag2" autocomplete="off" spellcheck="false">
        <svg class="trail"><use href="#i-chevron-down"/></svg>
        <div class="menu"></div>
      </div>
    </div>

    <div class="inline">
      <div class="field" style="flex: none">
        <label>Nama</label>
        <div class="seg h34" id="type" role="tablist">
          <button role="tab" aria-selected="true" data-v="Instance Name" title="Nama instance">Instance</button>
          <button role="tab" aria-selected="false" data-v="Definition Name" title="Nama definition">Definition</button>
        </div>
      </div>
      <div class="field grow">
        <label for="keyword">Kata kunci</label>
        <div class="with-ic">
          <svg class="lead"><use href="#i-search"/></svg>
          <input class="input" id="keyword" placeholder="Nama persis…" autocomplete="off" spellcheck="false">
        </div>
      </div>
    </div>

    <div class="toggle" id="useAttr" role="switch" aria-checked="false" tabindex="0">
      <svg class="ic"><use href="#i-key-round"/></svg>
      <div class="txt">
        <div class="t">Filter atribut</div>
        <div class="s">Cocokkan key / value attribute dictionary</div>
      </div>
      <div class="switch"></div>
    </div>

    <div id="attr">
      <div class="field">
        <label for="attrKey">Key</label>
        <div class="inline">
          <div class="combo with-ic grow" id="cAttr">
            <svg class="lead"><use href="#i-key-round"/></svg>
            <input class="input" id="attrKey" autocomplete="off" spellcheck="false" placeholder="Pilih key atribut…">
            <svg class="trail"><use href="#i-chevron-down"/></svg>
            <div class="menu"></div>
          </div>
          <button class="btn ghost icon sm" id="manage" title="Kelola key">
            <svg><use href="#i-settings-2"/></svg>
          </button>
        </div>
      </div>
      <div class="field">
        <label for="attrVal">Value <span style="font-weight:400">(kosong = semua)</span></label>
        <input class="input" id="attrVal" placeholder="Masukkan value…" autocomplete="off" spellcheck="false">
      </div>
    </div>

    <div class="spacer"></div>
    <button class="btn primary" id="btnSubmit">
      <svg><use href="#i-mouse-pointer-click"/></svg><span>Jalankan seleksi</span>
    </button>
  </section>

  <!-- Hasil -->
  <section class="step" id="step2">
    <div class="hero">
      <div class="badge ok draw"><svg><use href="#i-check"/></svg></div>
      <h2>Seleksi selesai</h2>
      <p id="success-msg"></p>
    </div>
    <div class="spacer"></div>
    <div class="actions row">
      <button class="btn ghost" onclick="showStep(1)">
        <svg><use href="#i-rotate-ccw"/></svg><span>Seleksi lagi</span>
      </button>
      <button class="btn primary" onclick="backToHub()">
        <svg><use href="#i-house"/></svg><span>Tutup</span>
      </button>
    </div>
  </section>

  <!-- Kelola key atribut -->
  <div class="overlay" id="modal">
    <div class="sheet">
      <h3>Key atribut</h3>
      <div class="list keys" id="keyList"></div>
      <div class="inline">
        <input class="input grow" id="newKey" placeholder="Key baru…" autocomplete="off" spellcheck="false">
        <button class="btn primary sm" id="addKey"><svg><use href="#i-plus"/></svg><span>Tambah</span></button>
      </div>
      <button class="btn ghost" id="closeModal">Selesai</button>
    </div>
  </div>

  <script>
    var ALL = '(Semua Tag / Abaikan)'; // Ruby membandingkan string ini persis
    var tags = [], keys = [];
    var $ = function (id) { return document.getElementById(id); };

    // ---- Combobox (tag & key atribut) ----
    function setupCombo(box, getItems, getFallback, emptyMsg) {
      var input = box.querySelector('input'), menu = box.querySelector('.menu');
      input.value = getFallback();

      function fill(q) {
        q = (q || '').toLowerCase();
        var all = getItems();
        var items = all.filter(function (t) { return t.toLowerCase().indexOf(q) > -1; });
        menu.innerHTML = items.length
          ? items.map(function (t) {
              var isSel = (t === (input.dataset.old || input.value));
              return '<div' + (isSel ? ' class="selected"' : '') + '>' + esc(t) + '</div>';
            }).join('')
          : '<div class="none">' + (emptyMsg || 'Tidak ditemukan') + '</div>';
      }
      box._fill = fill;
      function close() {
        box.classList.remove('open');
        if (!input.value.trim()) input.value = input.dataset.old || getFallback();
      }
      function open() {
        input.dataset.old = input.value;
        input.placeholder = input.value;
        input.value = '';
        fill('');
        box.classList.add('open');
      }
      input.addEventListener('focus', open);
      input.addEventListener('click', function () {
        if (!box.classList.contains('open')) open();
      });
      input.addEventListener('input', function () { fill(input.value); box.classList.add('open'); });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') {
          var first = menu.querySelector('div:not(.none)');
          if (first) input.value = first.textContent;
          input.blur();
        } else if (e.key === 'Escape') {
          input.value = input.dataset.old || getFallback();
          input.blur();
        }
      });
      input.addEventListener('blur', function () { setTimeout(close, 120); });
      menu.addEventListener('mousedown', function (e) {
        var it = e.target.closest('div');
        if (!it || it.classList.contains('none')) return;
        e.preventDefault();
        input.value = it.textContent;
        input.blur();
      });
    }
    setupCombo($('c1'), function () { return [ALL].concat(tags); }, function () { return ALL; }, 'Tag tidak ditemukan');
    setupCombo($('c2'), function () { return [ALL].concat(tags); }, function () { return ALL; }, 'Tag tidak ditemukan');
    setupCombo($('cAttr'), function () { return keys; }, function () { return keys[0] || 'a_posisi'; }, 'Key tidak ditemukan');

    // ---- Segmented: tipe nama ----
    $('type').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      this.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-selected', x === b); });
    });
    function searchType() { return $('type').querySelector('[aria-selected="true"]').dataset.v; }

    // ---- Switch atribut ----
    function toggleAttr() {
      var on = $('useAttr').getAttribute('aria-checked') !== 'true';
      $('useAttr').setAttribute('aria-checked', on);
      $('attr').classList.toggle('open', on);
      autoFitHeight(0);
    }
    $('useAttr').addEventListener('click', toggleAttr);
    $('useAttr').addEventListener('keydown', function (e) {
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); toggleAttr(); }
    });

    // ---- Key atribut ----
    function renderKeys(selected) {
      var input = $('attrKey');
      selected = selected || input.value;
      if (keys.indexOf(selected) > -1) {
        input.value = selected;
      } else {
        input.value = keys[0] || 'a_posisi';
      }
      $('keyList').innerHTML = keys.map(function (k) {
        return '<div class="k"><span>' + esc(k) + '</span>' +
          '<button class="btn icon" title="Hapus" data-key="' + esc(k) + '">' + icon('trash-2') + '</button></div>';
      }).join('');
    }
    $('keyList').addEventListener('click', function (e) {
      var b = e.target.closest('[data-key]');
      if (!b) return;
      keys = keys.filter(function (k) { return k !== b.dataset.key; });
      if (!keys.length) keys = ['a_posisi'];
      renderKeys();
      sketchup.delete_key(b.dataset.key);
    });
    function addKey() {
      var v = $('newKey').value.trim().toLowerCase();
      if (!v) return $('newKey').focus();
      if (keys.indexOf(v) < 0) { keys.push(v); sketchup.save_new_key(v); }
      renderKeys(v);
      $('newKey').value = '';
    }
    $('addKey').addEventListener('click', addKey);
    $('newKey').addEventListener('keydown', function (e) { if (e.key === 'Enter') addKey(); });
    $('manage').addEventListener('click', function () { $('modal').classList.add('open'); $('newKey').focus(); });
    $('closeModal').addEventListener('click', function () { $('modal').classList.remove('open'); });
    $('modal').addEventListener('mousedown', function (e) { if (e.target === this) this.classList.remove('open'); });

    // ---- Dipanggil dari Ruby ----
    function updateTags(newTags) {
      tags = newTags || [];
      // Jika tag yang sedang dipilih sudah terhapus di SketchUp, reset ke ALL
      ['tag1', 'tag2'].forEach(function (id) {
        var el = $(id);
        if (el && el.value !== ALL && tags.indexOf(el.value) === -1) {
          el.value = ALL;
          el.dataset.old = ALL;
        }
      });
      // Jika dropdown sedang terbuka, perbarui opsinya secara real-time
      ['c1', 'c2'].forEach(function (cid) {
        var box = $(cid);
        if (box && box.classList.contains('open') && typeof box._fill === 'function') {
          var input = box.querySelector('input');
          box._fill(input ? input.value : '');
        }
      });
    }

    function initUIData(data) {
      if (data.tags) updateTags(data.tags);
      if (data.keys) {
        keys = data.keys;
        renderKeys();
      }
      autoFitHeight(0);
    }
    var origShowStep = showStep;
    showStep = function (n) {
      origShowStep(n);
      autoFitHeight(0);
      setTimeout(function () { autoFitHeight(0); }, 80);
    };

    function showSuccessStep(msg) {
      $('success-msg').innerHTML = msg;
      resetSubmitButton();
      showStep(2);
    }
    function resetSubmitButton() { busy('btnSubmit', false); }

    $('btnSubmit').addEventListener('click', function () {
      busy(this, true);
      try {
        if (window.sketchup && typeof sketchup.perform_selection === 'function') {
          sketchup.perform_selection(JSON.stringify({
            tag_utama: $('tag1').value,
            tag_kedua: $('tag2').value,
            search_type: searchType(),
            keyword: $('keyword').value,
            use_attr: $('useAttr').getAttribute('aria-checked') === 'true',
            attr_key: $('attrKey').value,
            attr_val: $('attrVal').value,
            left: window.screenX, top: window.screenY
          }));
        } else {
          resetSubmitButton();
          showToast('Fungsi Selector belum siap.', 'error');
        }
      } catch (err) {
        resetSubmitButton();
        showToast('Error: ' + err.message, 'error');
      }
    });
    $('keyword').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnSubmit').click(); });
    $('attrVal').addEventListener('keydown', function (e) { if (e.key === 'Enter') $('btnSubmit').click(); });


    function requestInit() {
      function tryInit() {
        if (window.sketchup && typeof sketchup.get_init_data === 'function') {
          sketchup.get_init_data();
          return true;
        }
        return false;
      }
      if (!tryInit()) {
        var retries = 0;
        var intv = setInterval(function () {
          retries++;
          if (tryInit() || retries > 30) {
            clearInterval(intv);
          }
        }, 50);
      }
    }
    requestInit();
    autoFitHeight(0);
  </script>
</body>
</html>
