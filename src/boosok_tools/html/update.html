<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Boosok Tools Update</title>
  <link rel="stylesheet" href="../css/ui.css">
  <script src="../js/strings.js"></script>
  <script src="../js/locale.js"></script>
  <style>
    #app {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .versions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: -4px;
      color: var(--muted);
    }

    .versions svg {
      width: 14px;
      height: 14px;
    }

    .btn.primary:hover svg {
      transform: translateX(2px);
    }

    .btn.ghost:hover svg {
      transform: rotate(-60deg);
    }

    /* Changelog */
    .card {
      flex: 0 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
    }

    .card ul {
      margin: 0;
      padding: 4px 12px 12px;
      list-style: none;
      overflow-y: auto;
      max-height: 280px;
    }

    .card li {
      position: relative;
      padding-left: 14px;
      font-size: 12.5px;
      line-height: 1.55;
      margin-top: 4px;
      user-select: text;
    }

    .card li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 8px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
    }

    .card ul::-webkit-scrollbar {
      width: 8px;
    }

    .card ul::-webkit-scrollbar-thumb {
      background: var(--line-strong);
      border-radius: 8px;
      border: 2px solid var(--surface);
    }

    /* Progress */
    .progress {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .progress .meta {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
    }

    .progress .meta b {
      color: var(--ink);
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }

    .bar {
      height: 6px;
      background: var(--line);
      border-radius: 999px;
      overflow: hidden;
    }

    .bar>div {
      height: 100%;
      width: 0;
      border-radius: inherit;
      background: var(--accent) linear-gradient(90deg, transparent, rgba(255, 255, 255, .4), transparent) no-repeat;
      background-size: 60px 100%;
      animation: shimmer 1.2s linear infinite;
      transition: width .3s var(--ease);
    }

    .bar.indeterminate>div {
      width: 35% !important;
      animation: slide 1.2s ease-in-out infinite;
    }

    @keyframes shimmer {
      from {
        background-position: -60px 0;
      }

      to {
        background-position: 360px 0;
      }
    }

    @keyframes slide {
      from {
        margin-left: -35%;
      }

      to {
        margin-left: 100%;
      }
    }

    .author-credit {
      text-align: center;
      margin: 16px 0;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.02em;
    }
  </style>
</head>

<body oncontextmenu="return false;">
  <script src="../js/ui.js"></script>

  <header class="head">
    <div class="mark"><svg>
        <use href="#i-package" />
      </svg></div>
    <div class="txt">
      <h1 data-i18n="upd_title">Boosok Tools</h1>
      <p data-i18n="upd_sub">Pembaruan plugin</p>
    </div>
    <span class="pill" id="cur"></span>
    <button class="theme-btn" id="themeToggle" type="button" title="Ganti Tema" aria-label="Ganti Tema" data-i18n-title="theme_toggle" data-i18n-aria="theme_toggle"></button>
  </header>

  <main id="app" aria-live="polite"></main>

  <script>
    // Semua state ada di Ruby (Updater). Halaman ini cuma render(state) + kirim aksi.
    var app = document.getElementById('app');
    var lastStatus = null;

    function btn(action, label, kind, ic) {
      return '<div class="btn ' + kind + '" role="button" tabindex="0" data-action="' + action + '">' +
        '<span>' + label + '</span>' + (ic ? icon(ic) : '') + '</div>';
    }
    function hero(badge, title, sub) {
      return '<div class="hero">' + badge + '<h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>';
    }
    function badge(ic, cls) { return '<div class="badge ' + (cls || '') + '">' + icon(ic) + '</div>'; }
    function v(x, cls) { return '<span class="pill ' + (cls || '') + '">v' + esc(x) + '</span>'; }

    // "- a\n- b" -> <li>a</li><li>b</li>
    function changelog(text) {
      var items = String(text || '').split(/\r?\n/)
        .map(function (l) { return l.replace(/^\s*[-*•]\s*/, '').trim(); })
        .filter(Boolean);
      if (!items.length) items = [t('upd_no_changelog', 'Tidak ada catatan perubahan.')];
      return items.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('');
    }

    var views = {
      idle: function (s) { return views.checking(s); },
      checking: function () {
        return hero(badge('search', 'pulse bob'), t('upd_checking_title', 'Memeriksa pembaruan'), t('upd_checking_sub', 'Menghubungi server…')) +
          '<div class="spacer"></div><div class="actions">' + btn('close', t('close', 'Tutup'), 'ghost') + '</div>';
      },
      latest: function (s) {
        var subText = t('upd_latest_sub', 'Boosok Tools {ver} sudah paling baru.').replace('{ver}', v(s.current));
        return hero(badge('check', 'ok draw'), t('upd_latest_title', 'Sudah versi terbaru'), subText) +
          '<div class="author-credit">' + t('upd_author', 'Dibuat oleh: &quot;Muh Qosob&quot;') + '</div>' +
          '<div class="spacer"></div><div class="actions row">' +
          btn('check', t('upd_check_again', 'Cek lagi'), 'ghost', 'refresh-cw') + btn('close', t('close', 'Tutup'), 'primary') + '</div>' +
          '<div class="actions" style="align-items:center">' + btn('changelog', t('upd_changelog', 'Lihat Change Log di GitHub'), 'link', 'external-link') + '</div>';
      },
      available: function (s) {
        return hero(badge('arrow-up', 'pulse'), t('upd_avail_title', 'Update tersedia')) +
          '<div class="versions">' + v(s.current) + icon('arrow-right') + v(s.latest, 'new') + '</div>' +
          '<div class="card"><div class="cap">' + t('upd_whats_new', 'Yang baru') + '</div><ul>' + changelog(s.changelog) + '</ul></div>' +
          '<div class="actions row">' + btn('close', t('upd_later', 'Nanti'), 'ghost') +
          btn('download', t('upd_now', 'Update sekarang'), 'primary', 'arrow-right') + '</div>';
      },
      downloading: function (s) {
        var known = s.progress > 0;
        var downTitle = t('upd_downloading', 'Mengunduh {ver}').replace('{ver}', v(s.latest, 'new'));
        return hero(badge('download', 'bob'), downTitle) +
          '<div class="progress"><div class="meta"><span>' + t('upd_download_pkg', 'Mengunduh paket') + '</span><b id="pct">' +
          (known ? s.progress + '%' : '…') + '</b></div>' +
          '<div class="bar' + (known ? '' : ' indeterminate') + '" id="bar"><div style="width:' +
          (known ? s.progress : 0) + '%"></div></div></div><div class="spacer"></div>' +
          '<div class="note">' + icon('info') + '<span>' + t('upd_keep_working', 'Boleh lanjut kerja, jendela ini kasih tahu kalau sudah selesai.') + '</span></div>';
      },
      installing: function (s) {
        var instTitle = t('upd_installing', 'Memasang {ver}').replace('{ver}', v(s.latest, 'new'));
        return hero(badge('settings', 'spin'), instTitle, t('upd_dont_close', 'Jangan tutup SketchUp dulu.')) +
          '<div class="progress"><div class="bar indeterminate"><div></div></div></div><div class="spacer"></div>';
      },
      done: function (s) {
        return hero(badge('check', 'ok draw'), t('upd_done_title', 'Update berhasil!'),
          v(s.latest, 'new') + '<br><br>' + (s.restart
            ? t('upd_done_sub_restart', 'terpasang. Restart SketchUp agar versi baru aktif.')
            : t('upd_done_sub', 'sudah langsung update tanpa perlu restart SketchUp.'))) +
          '<div class="spacer"></div><div class="note">' + icon('info') +
          '<span>' + t('upd_done_hint', 'Jika ada jendela fitur yang sedang terbuka, silakan tutup dan buka kembali.') + '</span></div>' +
          '<div class="actions row">' +
          btn('quit', t('upd_restart_su', 'Restart SketchUp'), 'ghost', 'power') +
          btn('close', t('close', 'Tutup'), 'primary', 'check') + '</div>' +
          '<div class="actions" style="align-items:center">' + btn('changelog', t('upd_changelog', 'Lihat Change Log di GitHub'), 'link', 'external-link') + '</div>';
      },
      error: function (s) {
        var errMsg = s.error ? (window.translateMessage ? window.translateMessage(s.error) : s.error) : t('upd_fail_generic', 'Terjadi kesalahan.');
        return hero(badge('triangle-alert', 'err'), t('upd_fail_title', 'Gagal memperbarui')) +
          '<div class="note err">' + icon('circle-alert') + '<span>' + esc(errMsg) + '</span></div>' +
          '<div class="spacer"></div><div class="actions">' +
          '<div class="actions row">' + btn('close', t('close', 'Tutup'), 'ghost') + btn('check', t('upd_retry', 'Coba lagi'), 'primary', 'refresh-cw') + '</div>' +
          btn('browser', t('upd_manual', 'Download manual di browser'), 'link', 'external-link') + '</div>';
      }
    };

    function render(state) {
      document.getElementById('cur').textContent = state.current ? 'v' + state.current : '';

      // Progress di-push berkali-kali: cukup geser bar, jangan render ulang (animasi tidak restart)
      if (state.status === lastStatus && state.status === 'downloading') {
        if (state.progress > 0) {
          var bar = document.getElementById('bar');
          bar.classList.remove('indeterminate');
          bar.firstChild.style.width = state.progress + '%';
          document.getElementById('pct').textContent = state.progress + '%';
        }
        return;
      }

      lastStatus = state.status;
      app.classList.remove('locked', 'enter');
      app.innerHTML = (views[state.status] || views.error)(state);
      void app.offsetWidth; // restart animasi masuk
      app.classList.add('enter');
      autoFitHeight(0);
      setTimeout(function () { autoFitHeight(0); }, 120);
    }

    function act(el) {
      if (app.classList.contains('locked')) return; // cegah double klik
      var a = el.dataset.action;
      // Kunci cuma untuk aksi yang pasti dibalas render() dari Ruby.
      // browser/quit/close tidak (quit bisa dibatalkan user) -> tombol jangan macet.
      if (a === 'check' || a === 'download') app.classList.add('locked');
      if (a === 'changelog') {
        // Buka link langsung dari JS sebagai fallback jika Ruby tidak tersedia
        if (window.sketchup && typeof sketchup.changelog === 'function') {
          sketchup.changelog();
        } else {
          window.open('https://github.com/muhqosob/boosok-tools/blob/main/the_bosok/CHANGELOG.md', '_blank');
        }
        return;
      }
      if (window.sketchup && typeof sketchup[a] === 'function') {
        sketchup[a]();
      }
    }
    app.addEventListener('click', function (e) {
      var b = e.target.closest('[data-action]');
      if (b) act(b);
    });
    app.addEventListener('keydown', function (e) {
      var b = e.target.closest('[data-action]');
      if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(b); }
    });

    render({ status: 'checking' });
    if (window.sketchup && typeof sketchup.ready === 'function') {
      sketchup.ready();
    }
    autoFitHeight(0);
  </script>
</body>

</html>
