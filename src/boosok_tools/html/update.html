<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boosok Tools Update</title>
  <link rel="stylesheet" href="../css/ui.css">
  <style>
    #app { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 14px; }
    .versions { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: -4px; color: var(--muted); }
    .versions svg { width: 14px; height: 14px; }
    .btn.primary:hover svg { transform: translateX(2px); }
    .btn.ghost:hover svg { transform: rotate(-60deg); }

    /* Changelog */
    .card { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    .card ul { margin: 0; padding: 4px 12px 12px; list-style: none; overflow-y: auto; }
    .card li { position: relative; padding-left: 14px; font-size: 12.5px; line-height: 1.55; margin-top: 4px; user-select: text; }
    .card li::before { content: ""; position: absolute; left: 2px; top: 8px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
    .card ul::-webkit-scrollbar { width: 8px; }
    .card ul::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 8px; border: 2px solid var(--surface); }

    /* Progress */
    .progress { display: flex; flex-direction: column; gap: 8px; }
    .progress .meta { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .progress .meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
    .bar { height: 6px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .bar > div {
      height: 100%; width: 0; border-radius: inherit;
      background: var(--accent) linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent) no-repeat;
      background-size: 60px 100%;
      animation: shimmer 1.2s linear infinite;
      transition: width .3s var(--ease);
    }
    .bar.indeterminate > div { width: 35% !important; animation: slide 1.2s ease-in-out infinite; }
    @keyframes shimmer { from { background-position: -60px 0; } to { background-position: 360px 0; } }
    @keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
  </style>
</head>
<body oncontextmenu="return false;">
  <script src="../js/ui.js"></script>

  <header class="head">
    <div class="mark"><svg><use href="#i-package"/></svg></div>
    <div class="txt">
      <h1>Boosok Tools</h1>
      <p>Pembaruan plugin</p>
    </div>
    <span class="pill" id="cur"></span>
    <button class="theme-btn" id="themeToggle" type="button" title="Ganti Tema" aria-label="Ganti Tema"></button>
  </header>

  <main id="app" aria-live="polite"></main>

  <script>
    // Semua state ada di Ruby (Updater). Halaman ini cuma render(state) + kirim aksi.
    var app = document.getElementById('app');
    var lastStatus = null;

    function btn(action, label, kind, ic) {
      return '<div class="btn ' + kind + '" role="button" tabindex="0" data-action="' + action + '">' +
        '<span>' + label + '</span>' + (ic ? icon(ic) : '') + '</div>';
    }
    function hero(badge, title, sub) {
      return '<div class="hero">' + badge + '<h2>' + title + '</h2>' + (sub ? '<p>' + sub + '</p>' : '') + '</div>';
    }
    function badge(ic, cls) { return '<div class="badge ' + (cls || '') + '">' + icon(ic) + '</div>'; }
    function v(x, cls) { return '<span class="pill ' + (cls || '') + '">v' + esc(x) + '</span>'; }

    // "- a\n- b" -> <li>a</li><li>b</li>
    function changelog(text) {
      var items = String(text || '').split(/\r?\n/)
        .map(function (l) { return l.replace(/^\s*[-*•]\s*/, '').trim(); })
        .filter(Boolean);
      if (!items.length) items = ['Tidak ada catatan perubahan.'];
      return items.map(function (l) { return '<li>' + esc(l) + '</li>'; }).join('');
    }

    var views = {
      idle: function (s) { return views.checking(s); },
      checking: function () {
        return hero(badge('search', 'pulse bob'), 'Memeriksa pembaruan', 'Menghubungi server…') +
          '<div class="spacer"></div><div class="actions">' + btn('close', 'Tutup', 'ghost') + '</div>';
      },
      latest: function (s) {
        return hero(badge('check', 'ok draw'), 'Sudah versi terbaru',
          'Boosok Tools ' + v(s.current) + ' sudah paling baru.') +
          '<div class="spacer"></div><div class="actions row">' +
          btn('check', 'Cek lagi', 'ghost', 'refresh-cw') + btn('close', 'Selesai', 'primary') + '</div>';
      },
      available: function (s) {
        return hero(badge('arrow-up', 'pulse'), 'Update tersedia') +
          '<div class="versions">' + v(s.current) + icon('arrow-right') + v(s.latest, 'new') + '</div>' +
          '<div class="card"><div class="cap">Yang baru</div><ul>' + changelog(s.changelog) + '</ul></div>' +
          '<div class="actions row">' + btn('close', 'Nanti', 'ghost') +
          btn('download', 'Update sekarang', 'primary', 'arrow-right') + '</div>';
      },
      downloading: function (s) {
        var known = s.progress > 0;
        return hero(badge('download', 'bob'), 'Mengunduh ' + v(s.latest, 'new')) +
          '<div class="progress"><div class="meta"><span>Mengunduh paket</span><b id="pct">' +
          (known ? s.progress + '%' : '…') + '</b></div>' +
          '<div class="bar' + (known ? '' : ' indeterminate') + '" id="bar"><div style="width:' +
          (known ? s.progress : 0) + '%"></div></div></div><div class="spacer"></div>' +
          '<div class="note">' + icon('info') + '<span>Boleh lanjut kerja, jendela ini kasih tahu kalau sudah selesai.</span></div>';
      },
      installing: function (s) {
        return hero(badge('settings', 'spin'), 'Memasang ' + v(s.latest, 'new'), 'Jangan tutup SketchUp dulu.') +
          '<div class="progress"><div class="bar indeterminate"><div></div></div></div><div class="spacer"></div>';
      },
      done: function (s) {
        return hero(badge('check', 'ok draw'), 'Update berhasil!',
          v(s.latest, 'new') + ' sudah langsung aktif tanpa perlu restart SketchUp.') +
          '<div class="spacer"></div><div class="note">' + icon('info') +
          '<span>Jika ada jendela fitur yang sedang terbuka, silakan tutup dan buka kembali.</span></div>' +
          '<div class="actions row">' +
          btn('quit', 'Restart SketchUp', 'ghost', 'power') +
          btn('close', 'Selesai', 'primary', 'check') + '</div>';
      },
      error: function (s) {
        return hero(badge('triangle-alert', 'err'), 'Gagal memperbarui') +
          '<div class="note err">' + icon('circle-alert') + '<span>' + esc(s.error || 'Terjadi kesalahan.') + '</span></div>' +
          '<div class="spacer"></div><div class="actions">' +
          '<div class="actions row">' + btn('close', 'Tutup', 'ghost') + btn('check', 'Coba lagi', 'primary', 'refresh-cw') + '</div>' +
          btn('browser', 'Download manual di browser', 'link', 'external-link') + '</div>';
      }
    };

    function render(state) {
      document.getElementById('cur').textContent = state.current ? 'v' + state.current : '';

      // Progress di-push berkali-kali: cukup geser bar, jangan render ulang (animasi tidak restart)
      if (state.status === lastStatus && state.status === 'downloading') {
        if (state.progress > 0) {
          var bar = document.getElementById('bar');
          bar.classList.remove('indeterminate');
          bar.firstChild.style.width = state.progress + '%';
          document.getElementById('pct').textContent = state.progress + '%';
        }
        return;
      }

      lastStatus = state.status;
      app.classList.remove('locked', 'enter');
      app.innerHTML = (views[state.status] || views.error)(state);
      void app.offsetWidth; // restart animasi masuk
      app.classList.add('enter');
    }

    function act(el) {
      if (app.classList.contains('locked')) return; // cegah double klik
      var a = el.dataset.action;
      // Kunci cuma untuk aksi yang pasti dibalas render() dari Ruby.
      // browser/quit/close tidak (quit bisa dibatalkan user) -> tombol jangan macet.
      if (a === 'check' || a === 'download') app.classList.add('locked');
      sketchup[a]();
    }
    app.addEventListener('click', function (e) {
      var b = e.target.closest('[data-action]');
      if (b) act(b);
    });
    app.addEventListener('keydown', function (e) {
      var b = e.target.closest('[data-action]');
      if (b && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(b); }
    });

    render({ status: 'checking' });
    sketchup.ready();
  </script>
</body>
</html>
