<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Group Cleaner</title>
  <link rel="stylesheet" href="../css/ui.css">
</head>
<body oncontextmenu="return false;">
  <script src="../js/ui.js"></script>

  <header class="head">
    <button class="back-btn" type="button" title="Kembali ke The Boosok Tools" aria-label="Kembali ke Hub" onclick="backToHub()"><svg><use href="#i-arrow-left"/></svg></button>
    <div class="mark"><svg><use href="#i-sparkles"/></svg></div>
    <div class="txt">
      <h1>Group Cleaner</h1>
      <p>Component jadi group murni</p>
    </div>
    <button class="theme-btn" id="themeToggle" type="button" title="Ganti Tema" aria-label="Ganti Tema"></button>
  </header>

  <section class="step active" id="step1">
    <div class="card">
      <div class="cap">Yang dilakukan</div>
      <ul class="steps">
        <li>
          <div class="ic"><svg><use href="#i-eraser"/></svg></div>
          <div><div class="t">Hapus 2d__Line</div><div class="s">Semua group / component bernama 2d__Line</div></div>
        </li>
        <li>
          <div class="ic"><svg><use href="#i-key-round"/></svg></div>
          <div><div class="t">Bersihkan atribut</div><div class="s">Termasuk dynamic attributes</div></div>
        </li>
        <li>
          <div class="ic"><svg><use href="#i-box"/></svg></div>
          <div><div class="t">Semua isi jadi group</div><div class="s">Tag & posisi tetap, instance lain aman</div></div>
        </li>
      </ul>
    </div>
    <div class="note"><svg><use href="#i-info"/></svg><span>Seleksi tepat <b>1 component</b> di model dulu.</span></div>
    <div class="spacer"></div>
    <button class="btn primary" id="btnExec" onclick="executeCleanGroup(this)">
      <svg><use href="#i-sparkles"/></svg><span>Bersihkan</span>
    </button>
  </section>

  <section class="step" id="step2">
    <div class="hero">
      <div class="badge ok draw"><svg><use href="#i-check"/></svg></div>
      <h2>Sudah bersih</h2>
      <p id="success-message"></p>
    </div>
    <div class="spacer"></div>
    <div class="actions row">
      <button class="btn ghost" onclick="closeDialog()">Tutup</button>
      <button class="btn primary" onclick="restartClean()">
        <svg><use href="#i-rotate-ccw"/></svg><span>Lagi</span>
      </button>
    </div>
  </section>

  <script>
    function executeCleanGroup(btn) {
      busy(btn, true);
      try {
        if (window.sketchup && typeof sketchup.proses_clean_group === 'function') {
          sketchup.proses_clean_group();
        } else {
          resetExecButton();
          showToast('Fungsi Group Cleaner belum siap. Silakan coba lagi.', 'error');
        }
      } catch (err) {
        resetExecButton();
        showToast('Error: ' + err.message, 'error');
      }
    }

    function restartClean() {
      try {
        if (window.sketchup && typeof sketchup.clean_restart_process === 'function') {
          sketchup.clean_restart_process();
        } else if (window.sketchup && typeof sketchup.restart_process === 'function') {
          sketchup.restart_process();
        } else {
          showStep(1);
          resetExecButton();
        }
      } catch (err) {
        showStep(1);
        resetExecButton();
      }
    }

    function closeDialog() {
      if (window.sketchup && typeof sketchup.closeDialog === 'function') {
        sketchup.closeDialog();
      } else if (window.sketchup && typeof sketchup.close_dialog === 'function') {
        sketchup.close_dialog();
      } else if (window.sketchup && typeof sketchup.close === 'function') {
        sketchup.close();
      } else {
        window.close();
      }
    }

    // Dipanggil dari Ruby: showStep(n), showToast(msg), resetExecButton(), showSuccessStep(msg)
    function resetExecButton() { busy('btnExec', false); }
    function showSuccessStep(msg) {
      document.getElementById('success-message').textContent = msg;
      showStep(2);
      autoFitHeight(0);
    }

    var origShowStep = showStep;
    showStep = function (n) {
      origShowStep(n);
      autoFitHeight(0);
    };

    autoFitHeight(0);
  </script>
</body>
</html>
