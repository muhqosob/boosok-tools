<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hide on Scene</title>
  <link rel="stylesheet" href="../css/ui.css">
  <style>
    .bar { display: flex; gap: 6px; flex-shrink: 0; background: transparent; }
    .bar .with-ic { flex: 1; background: transparent; }
    .sub { display: flex; align-items: center; margin: 0 2px -4px; }
    .sub .label { margin: 0; }
    .tab { display: none; flex: 1; min-height: 0; flex-direction: column; gap: 10px; }
    .tab.active { display: flex; animation: rise .25s var(--ease); }
    .actions .btn.icon { flex: none; width: 38px; height: 38px; }
  </style>
</head>
<body oncontextmenu="return false;">
  <script src="../js/ui.js"></script>

  <header class="head">
    <button class="back-btn" type="button" title="Kembali ke The Boosok Tools" aria-label="Kembali ke Hub" onclick="backToHub()"><svg><use href="#i-arrow-left"/></svg></button>
    <div class="mark"><svg><use href="#i-eye-off"/></svg></div>
    <div class="txt">
      <h1>Hide on Scene</h1>
      <p>Atur visibilitas tag & objek per scene</p>
    </div>
    <span class="pill" id="cur">1 / 2</span>
    <button class="theme-btn" id="themeToggle" type="button" title="Ganti Tema" aria-label="Ganti Tema"></button>
  </header>

  <!-- Langkah 1: scene -->
  <section class="step active" id="step1" data-label="1 / 2">
    <div class="sub"><span class="label">Scene</span><span class="count" id="nScene"></span></div>
    <div class="bar">
      <div class="with-ic">
        <svg class="lead"><use href="#i-search"/></svg>
        <input class="input" placeholder="Cari scene…" data-filter="listScenes" autocomplete="off" spellcheck="false">
      </div>
      <button class="btn ghost sm" data-all="listScenes">Semua</button>
      <button class="btn ghost sm icon" data-clear="listScenes" title="Kosongkan pilihan"><svg><use href="#i-x"/></svg></button>
    </div>
    <div class="list" id="listScenes"></div>
    <div class="actions row">
      <button class="btn ghost sm" id="btnIsolate" title="Isolasi objek terseleksi di scene aktif"
              onclick="executeIsolate(this)">
        <svg><use href="#i-focus"/></svg><span>Isolate</span>
      </button>
      <button class="btn ghost sm" id="btnEndIsolate" title="Tampilkan semua objek tersembunyi termasuk dalam group"
              onclick="executeEndIsolate(this)">
        <svg><use href="#i-eye"/></svg><span>End Isolate</span>
      </button>
      <button class="btn primary sm" onclick="goToStep2()"><span>Lanjut</span><svg><use href="#i-arrow-right"/></svg></button>
    </div>
  </section>

  <!-- Langkah 2: tag / objek -->
  <section class="step" id="step2" data-label="2 / 2">
    <div class="seg" id="tabs" role="tablist">
      <button role="tab" aria-selected="true" data-tab="TabTag"><svg><use href="#i-tags"/></svg>Tag</button>
      <button role="tab" aria-selected="false" data-tab="TabObject"><svg><use href="#i-box"/></svg>Objek</button>
    </div>

    <div class="tab active" id="TabTag">
      <div class="bar">
        <div class="with-ic">
          <svg class="lead"><use href="#i-search"/></svg>
          <input class="input" placeholder="Cari tag…" data-filter="listTags" autocomplete="off" spellcheck="false">
        </div>
        <button class="btn ghost sm" data-all="listTags">Semua</button>
        <button class="btn ghost sm icon" data-clear="listTags" title="Kosongkan pilihan"><svg><use href="#i-x"/></svg></button>
      </div>
      <div class="list" id="listTags"></div>
      <div class="actions row">
        <button class="btn ghost icon" onclick="showStep(1)" title="Kembali ke scene"><svg><use href="#i-arrow-left"/></svg></button>
        <button class="btn danger" id="btnHideTag" onclick="terapkanTag('hide', this)"><svg><use href="#i-eye-off"/></svg><span>Hide</span></button>
        <button class="btn primary" id="btnUnhideTag" onclick="terapkanTag('unhide', this)"><svg><use href="#i-eye"/></svg><span>Unhide</span></button>
      </div>
    </div>

    <div class="tab" id="TabObject">
      <div class="card">
        <div class="cap">Alur kerja</div>
        <ul class="steps">
          <li>
            <div class="ic"><svg><use href="#i-square-dashed-mouse-pointer"/></svg></div>
            <div><div class="t">Seleksi objek / group</div><div class="s">Langsung di viewport SketchUp</div></div>
          </li>
          <li>
            <div class="ic"><svg><use href="#i-eye"/></svg></div>
            <div><div class="t">Pilih Hide atau Unhide</div><div class="s">Berlaku di semua scene yang dicentang</div></div>
          </li>
        </ul>
      </div>
      <div class="note"><svg><use href="#i-info"/></svg><span>Pakai 5D+ Select Tools supaya bisa seleksi group di dalam group tanpa membukanya.</span></div>
      <div class="spacer"></div>
      <div class="actions row">
        <button class="btn ghost icon" onclick="showStep(1)" title="Kembali ke scene"><svg><use href="#i-arrow-left"/></svg></button>
        <button class="btn danger" id="btnHideObj" onclick="terapkanObjek('hide', this)"><svg><use href="#i-eye-off"/></svg><span>Hide</span></button>
        <button class="btn primary" id="btnUnhideObj" onclick="terapkanObjek('unhide', this)"><svg><use href="#i-eye"/></svg><span>Unhide</span></button>
      </div>
    </div>
  </section>

  <!-- Selesai -->
  <section class="step" id="step3">
    <div class="hero">
      <div class="badge ok draw"><svg><use href="#i-check"/></svg></div>
      <h2>Berhasil</h2>
      <p id="success-message"></p>
    </div>
    <div class="spacer"></div>
    <div class="actions row">
      <button class="btn ghost" onclick="sketchup.closeDialog()">Tutup</button>
      <button class="btn primary" onclick="showStep(1)"><svg><use href="#i-rotate-ccw"/></svg><span>Lanjut lagi</span></button>
    </div>
  </section>

  <script>
    var $ = function (id) { return document.getElementById(id); };

    function checked(id) {
      return Array.prototype.map.call($(id).querySelectorAll('input:checked'), function (c) { return c.value; });
    }
    function updateCount() {
      var n = checked('listScenes').length;
      $('nScene').textContent = n ? n + ' dipilih' : '';
    }
    $('listScenes').addEventListener('change', updateCount);

    function updateList(id, items, emptyText, onUpdate) {
      var listEl = $(id);
      if (!listEl) return;
      var sel = new Set(checked(id));
      var scrollTop = listEl.scrollTop;

      if (!items || !items.length) {
        listEl.innerHTML = '<div class="empty">' + emptyText + '</div>';
      } else {
        listEl.innerHTML = items.map(function (n) {
          var isChecked = sel.has(n) ? ' checked' : '';
          return '<label class="check"><input type="checkbox" value="' + esc(n) + '"' + isChecked + '>' +
            '<span class="box">' + icon('check') + '</span><span>' + esc(n) + '</span></label>';
        }).join('');
      }
      listEl.scrollTop = scrollTop;

      var searchInput = document.querySelector('input[data-filter="' + id + '"]');
      var q = searchInput ? searchInput.value.toLowerCase().trim() : '';
      if (q) {
        listEl.querySelectorAll('.check').forEach(function (l) {
          l.style.display = l.textContent.toLowerCase().indexOf(q) > -1 ? '' : 'none';
        });
      }
      if (onUpdate) onUpdate();
    }

    function updateScenes(scenes) {
      updateList('listScenes', scenes, 'Model ini belum punya scene.', updateCount);
      autoFitHeight(0);
    }

    function updateTags(tags) {
      updateList('listTags', tags, 'Tidak ada tag.');
      autoFitHeight(0);
    }

    // Search / Filter
    document.addEventListener('input', function (e) {
      var list = e.target.dataset.filter;
      if (!list) return;
      var q = e.target.value.toLowerCase().trim();
      $(list).querySelectorAll('.check').forEach(function (l) {
        l.style.display = (!q || l.textContent.toLowerCase().indexOf(q) > -1) ? '' : 'none';
      });
      autoFitHeight(0);
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && e.target.dataset && e.target.dataset.filter) {
        e.target.value = '';
        var list = e.target.dataset.filter;
        $(list).querySelectorAll('.check').forEach(function (l) {
          l.style.display = '';
        });
        autoFitHeight(0);
      }
    });

    // Tombol Pilih Semua (data-all) dan Kosongkan (data-clear)
    // Beroperasi hanya pada item yang sedang ditampilkan berdasarkan filter pencarian
    document.addEventListener('click', function (e) {
      var b = e.target.closest('[data-all],[data-clear]');
      if (!b) return;
      var on = !!b.dataset.all;
      var listId = b.dataset.all || b.dataset.clear;
      var listEl = $(listId);
      if (!listEl) return;

      listEl.querySelectorAll('.check').forEach(function (l) {
        if (l.style.display !== 'none') {
          var input = l.querySelector('input');
          if (input) input.checked = on;
        }
      });

      if (listId === 'listScenes') {
        updateCount();
      }
    });

    // Tab tag / objek
    $('tabs').addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      this.querySelectorAll('button').forEach(function (x) {
        x.setAttribute('aria-selected', x === b);
        $(x.dataset.tab).classList.toggle('active', x === b);
      });
      autoFitHeight(0);
    });

    var origShowStep = showStep;
    showStep = function (n) {
      origShowStep(n);
      autoFitHeight(0);
    };

    function goToStep2() {
      if (!checked('listScenes').length) return showToast('Centang minimal 1 scene dulu.');
      showStep(2);
    }

    // Hide/Unhide: tombol yang diklik jadi spinner, pasangannya ikut dikunci
    function lock(clicked, other) { busy(clicked, true); $(other).disabled = true; }
    function unlock(a, b) { busy(a, false); busy(b, false); }

    function executeIsolate(btn) {
      busy(btn, true);
      try {
        if (window.sketchup && typeof sketchup.prosesIsolateActive === 'function') {
          sketchup.prosesIsolateActive();
        } else {
          resetIsolateBtn();
          showToast('Fungsi Isolate belum siap.', 'error');
        }
      } catch (err) {
        resetIsolateBtn();
        showToast('Error: ' + err.message, 'error');
      }
    }

    function executeEndIsolate(btn) {
      busy(btn, true);
      try {
        if (window.sketchup && typeof sketchup.prosesEndIsolate === 'function') {
          sketchup.prosesEndIsolate();
        } else {
          resetIsolateBtn();
          showToast('Fungsi End Isolate belum siap.', 'error');
        }
      } catch (err) {
        resetIsolateBtn();
        showToast('Error: ' + err.message, 'error');
      }
    }

    function terapkanTag(action, btn) {
      var tags = checked('listTags');
      if (!tags.length) return showToast('Centang minimal 1 tag.');
      lock(btn, action === 'hide' ? 'btnUnhideTag' : 'btnHideTag');
      try {
        if (window.sketchup && typeof sketchup.prosesHideTags === 'function') {
          sketchup.prosesHideTags(checked('listScenes'), tags, action);
        } else {
          resetTagButton();
          showToast('Fungsi Hide Tag belum siap.', 'error');
        }
      } catch (err) {
        resetTagButton();
        showToast('Error: ' + err.message, 'error');
      }
    }

    function terapkanObjek(action, btn) {
      lock(btn, action === 'hide' ? 'btnUnhideObj' : 'btnHideObj');
      try {
        if (window.sketchup && typeof sketchup.prosesHideObjects === 'function') {
          sketchup.prosesHideObjects(checked('listScenes'), action);
        } else {
          resetObjButton();
          showToast('Fungsi Hide Objek belum siap.', 'error');
        }
      } catch (err) {
        resetObjButton();
        showToast('Error: ' + err.message, 'error');
      }
    }

    // ---- Dipanggil dari Ruby ----
    function init(data) {
      updateScenes(data.scenes || []);
      updateTags(data.tags || []);
      autoFitHeight(0);
    }
    function resetIsolateBtn() {
      busy('btnIsolate', false);
      busy('btnEndIsolate', false);
    }
    function resetTagButton() { unlock('btnHideTag', 'btnUnhideTag'); }
    function resetObjButton() { unlock('btnHideObj', 'btnUnhideObj'); }
    function showSuccessStep(msg) {
      resetTagButton(); resetObjButton();
      $('success-message').textContent = msg;
      showStep(3);
    }

    function requestInit() {
      function tryReady() {
        if (window.sketchup) {
          if (typeof sketchup.scene_ready === 'function') {
            sketchup.scene_ready();
            return true;
          } else if (typeof sketchup.ready === 'function') {
            sketchup.ready();
            return true;
          }
        }
        return false;
      }

      if (!tryReady()) {
        var retries = 0;
        var initInterval = setInterval(function () {
          retries++;
          if (tryReady() || retries > 30) {
            clearInterval(initInterval);
          }
        }, 50);
      }
    }

    requestInit();
    autoFitHeight(0);
  </script>
</body>
</html>
