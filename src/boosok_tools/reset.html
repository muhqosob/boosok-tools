<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reset Scale</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <script src="ui.js"></script>

  <header class="head">
    <div class="mark"><svg><use href="#i-scale-3d"/></svg></div>
    <div class="txt">
      <h1>Reset Scale</h1>
      <p>Kembalikan skala group / component</p>
    </div>
  </header>

  <section class="step active" id="step1">
    <div class="card">
      <div class="cap">Yang dilakukan</div>
      <ul class="steps">
        <li>
          <div class="ic"><svg><use href="#i-scale-3d"/></svg></div>
          <div><div class="t">Skala X / Y / Z jadi 1</div><div class="s">Posisi & rotasi tetap</div></div>
        </li>
        <li>
          <div class="ic"><svg><use href="#i-layers"/></svg></div>
          <div><div class="t">Semua seleksi sekaligus</div><div class="s">Selain group / component dilewati</div></div>
        </li>
      </ul>
    </div>
    <div class="spacer"></div>
    <button class="btn primary" id="btnExec" onclick="busy(this, true); sketchup.reset()">
      <svg><use href="#i-refresh-cw"/></svg><span>Reset skala</span>
    </button>
  </section>

  <section class="step" id="step2">
    <div class="hero">
      <div class="badge ok draw"><svg><use href="#i-check"/></svg></div>
      <h2>Skala di-reset</h2>
      <p id="success-message"></p>
    </div>
    <div class="spacer"></div>
    <div class="actions row">
      <button class="btn ghost" onclick="sketchup.close()">Tutup</button>
      <button class="btn primary" onclick="showStep(1)">
        <svg><use href="#i-rotate-ccw"/></svg><span>Lagi</span>
      </button>
    </div>
  </section>

  <script>
    // Dipanggil dari Ruby: showToast(msg), resetExecButton(), showSuccessStep(msg)
    function resetExecButton() { busy('btnExec', false); }
    function showSuccessStep(msg) {
      resetExecButton();
      document.getElementById('success-message').textContent = msg;
      showStep(2);
    }
  </script>
</body>
</html>
